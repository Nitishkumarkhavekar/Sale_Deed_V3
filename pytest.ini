[pytest]
# The suite is `tests/`, but `tests/corpus/` sits inside it and holds the sample
# deeds together with the research scripts that produced the finetuning corpus.
# Several of those are named `test_gemma_*.py` and would be collected on sight -
# they are standalone experiments needing vLLM and a loaded model, not tests, and
# collecting them turns a clean run into a wall of import errors.
testpaths = tests
norecursedirs = corpus .git .venv venv venv_new __pycache__ node_modules

# Quieter tracebacks; the assertion message is the useful part in this suite.
addopts = --tb=short
